<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recepční | Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white flex items-center justify-center font-sans">

    <div class="text-center p-8 max-w-2xl bg-slate-900/50 rounded-3xl border border-slate-800 shadow-2xl backdrop-blur-sm">
        <h1 class="text-4xl font-bold mb-4">Virtuální Recepce</h1>
        <p class="text-slate-400 text-lg mb-8">Vyzkoušejte si, jak naše AI odbaví hovor do vaší ordinace v reálném čase.</p>
        
        <div id="vapi-ui-container" class="py-4"></div>
        
        <p class="mt-8 text-sm text-slate-500 italic">Klikněte na tlačítko a začněte mluvit.</p>
    </div>

    <script>
      (function (d, t) {
        var s = d.createElement(t),
          g = d.getElementsByTagName(t)[0];
        s.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        s.defer = true; s.async = true;
        g.parentNode.insertBefore(s, g);

        s.onload = function () {
          vapiSDK.run({
            apiKey: "da9dac82-63b3-431b-997e-57475c818ad6", 
            assistant: "e7a23310-d13b-463e-ad41-68620a609b34",
            config: {
              position: "bottom-center",
              title: "AI Recepční",
              subtitle: "Online Demo",
              color: "#3b82f6", // Modrá
            },
          });
        };
      })(document, "script");
    </script>
</body>
</html>
